# Runs the radar every morning and commits the fresh report, so you can open
# report.html (or jobs.json) in the repo without running anything yourself.
# Keep this repo PRIVATE: applied.txt is your application history.

name: job radar

on:
  schedule:
    - cron: "37 5 * * *"   # 06:37 Lagos time, every day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest
      - name: Run radar
        run: python jobradar.py | tee radar.log
      - name: Commit report
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add report.html jobs.json seen.json
          git diff --cached --quiet || git commit -m "radar: $(grep -m1 'matching roles' radar.log)"
          git push
